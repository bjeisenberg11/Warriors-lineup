<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deerfield 9U Warriors — Lineup</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Warriors">
<meta name="application-name" content="Warriors">
<meta name="theme-color" content="#23262B">
<!-- Standalone mode is OFF. Two attempts, both tested on device, both failed:
       2026-08-30  enabled; Print did nothing from the home-screen icon.
       2026-08-31  forced a repaint (transform toggle, layout flush, two rAFs,
                   deferred call) before window.print(). Still nothing. Only
                   backgrounding the app and returning presents the sheet.
     The Safari fallback failed too, and predictably: iOS keeps same-origin
     navigation inside the web app's scope, so a target="_blank" link to our own
     URL just reloaded the app. A hand-off would need a different origin.
     Conclusion: printing works in Safari, not from a home-screen web app.
     iOS grants push only to home-screen web apps. One icon cannot do both.
     Do not re-enable without re-testing PRINT on a device first. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C8102E;
  --red-deep:#8E0B20;
  --red-wash:#FDECEE;
  --ink:#23262B;
  --steel:#565D66;
  --mute:#8B939C;
  --fog:#DDE1E6;
  --paper:#F3F4F6;
  --card:#FFFFFF;
  --amber:#B26A00;
  --amber-wash:#FFF6E6;
  --good:#1F7A45;
  --good-wash:#EAF6EF;
  --disp:"Barlow Condensed",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.4;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
/* 16px is the threshold: iOS zooms the page on focus for anything smaller,
   so every focusable field must sit at or above it. */
button,select,input,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ---------- Header ---------- */
/* Header and tabs stick as ONE block. Pinning both to top:0 separately made
   the tabs slide underneath the header on scroll. */
#chrome{position:sticky;top:0;z-index:40}
.top{
  background:var(--ink);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
}
.brandrow{display:flex;align-items:center;gap:10px}
.crest{width:34px;height:34px;flex:none;border-radius:50%;background:#fff;
  padding:1px;object-fit:contain}
@media (orientation:landscape) and (max-height:620px){.crest{width:26px;height:26px}}
.brand{font-family:var(--disp);font-weight:700;font-size:23px;letter-spacing:.045em;
  text-transform:uppercase;line-height:1}
.brand span{color:#B8BEC6;font-weight:500}
.status{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:#9AA2AB;text-align:right;line-height:1.3;
  border:1px solid transparent;border-radius:7px;padding:4px 7px}
.status:active{background:#31353C}
.status.err{border-color:#7A2A33;background:#3A2226}
.status b{display:block;color:#fff;font-weight:500}

.gamebar{display:flex;gap:8px;align-items:center;margin-top:9px}
.gamebar select{
  flex:1;min-width:0;background:#31353C;color:#fff;border:1px solid #454B54;
  border-radius:7px;padding:8px 9px;font-size:14px;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M1 1l4 4 4-4' stroke='%23AEB5BD' stroke-width='1.6' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:26px;
}
.newbtn{background:var(--red);color:#fff;border-radius:7px;padding:8px 12px;
  font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.05em;
  text-transform:uppercase;flex:none}

/* ---------- Tabs ---------- */
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--fog);
  overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;padding:11px 12px 9px;font-family:var(--disp);font-weight:600;font-size:15px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap;
  border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.tab .badge{display:inline-block;min-width:16px;height:16px;line-height:16px;padding:0 4px;
  margin-left:5px;border-radius:8px;background:var(--red);color:#fff;font-family:var(--mono);
  font-size:10px;font-weight:600;vertical-align:1px}

.wrap{padding:12px 12px 40px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--fog);border-radius:11px;
  padding:13px;margin-bottom:12px}
.h{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.07em;
  text-transform:uppercase;margin:0 0 9px;display:flex;align-items:center;gap:8px}
.h .rule{flex:1;height:1px;background:var(--fog)}
.sub{font-size:13px;color:var(--steel);margin:-4px 0 10px}

/* ---------- Grid ---------- */
.gridscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -13px;padding:0 13px}
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
table.grid th,table.grid td{padding:0;border-bottom:1px solid var(--fog)}
.poscell{
  position:sticky;left:0;z-index:2;background:var(--card);
  font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.05em;
  padding:0 9px 0 2px;text-align:left;white-space:nowrap;border-right:1px solid var(--fog);
}
.poscell small{display:block;font-family:var(--body);font-weight:500;font-size:9px;
  letter-spacing:.09em;color:var(--mute);text-transform:uppercase;margin-top:-3px}
.inhead{padding:5px 4px 6px;text-align:center;background:var(--card);
  border-bottom:1px solid var(--fog)}
.inhead .n{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.05em}
.dots{display:flex;gap:2px;justify-content:center;margin-top:3px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--fog)}
.dot.f{background:var(--steel)}
.inhead.done .dot.f{background:var(--red)}
.inhead.done .n{color:var(--red)}
td.cell{padding:2px 3px}
td.cell select{
  width:100%;min-width:96px;border:1px solid var(--fog);border-radius:6px;
  background:#fff;padding:7px 6px;font-size:14px;appearance:none;text-align:left;
}
td.cell select.empty{color:var(--mute);background:#FAFBFC;border-style:dashed}
td.cell select.dup{border-color:var(--red);border-width:2px;background:var(--red-wash);
  color:var(--red-deep);font-weight:600}
tr.benchrow td{background:#FAFAFB}
tr.benchrow .poscell{background:#FAFAFB;color:var(--steel)}
.benchnames{font-size:13px;color:var(--steel);padding:8px 5px;text-align:center;
  line-height:1.25;min-width:96px}
.benchnames.none{color:var(--mute)}

/* ---------- Landscape split ----------
   Turned sideways, the phone has room for the tally beside the grid, which is
   exactly when you want both: you are setting positions and watching counts. */
.rotatehint{font-size:12px;color:var(--mute);margin-top:9px;padding-top:9px;
  border-top:1px dashed var(--fog);line-height:1.4}
@media (orientation:landscape) and (max-height:620px){
  .wrap{max-width:none;padding:10px}
  .split{display:flex;gap:12px;align-items:flex-start}
  .splitmain{flex:1 1 auto;min-width:0}
  .splitside{flex:0 0 288px;position:sticky;
    top:calc(var(--chrome-h, 0px) + 10px);
    max-height:calc(100vh - var(--chrome-h, 0px) - 22px);
    overflow-y:auto;-webkit-overflow-scrolling:touch}
  .splitside .card{margin-bottom:10px}
  .rotatehint{display:none}
  .top{padding-top:calc(5px + env(safe-area-inset-top));padding-bottom:5px}
  .brand{font-size:19px}
  .gamebar{margin-top:6px}
  .gamebar select,.newbtn{padding-top:5px;padding-bottom:5px}
  .tab{padding:7px 12px 5px;font-size:14px}
}

/* ---------- Checks ---------- */
.cardsw{margin:-2px 0 9px}
.cardsw .seg{max-width:280px}
.cardsw .seg button b{font-family:var(--mono);font-size:11px;font-weight:600;
  background:rgba(255,255,255,.28);border-radius:8px;padding:0 5px;margin-left:3px}
.cardsw .seg button:not(.on) b{background:var(--fog);color:var(--steel)}

.hachip{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 8px;border-radius:4px;color:#fff}
.hachip.home{background:var(--red)}
.hachip.away{background:var(--steel)}
.matchup{font-size:14px;font-weight:600;color:var(--ink);margin:-4px 0 8px}
.matchup span{font-weight:400;color:var(--steel)}

.check{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;
  margin-bottom:6px;font-size:14px;line-height:1.35}
.check .tag{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;
  padding:2px 5px;border-radius:4px;flex:none;margin-top:1px}
.check.err{background:var(--red-wash);color:var(--red-deep)}
.check.err .tag{background:var(--red);color:#fff}
.check.warn{background:var(--amber-wash);color:#7A4A00}
.check.warn .tag{background:var(--amber);color:#fff}
.check.ok{background:var(--good-wash);color:var(--good)}
.check.info{background:#F1F3F5;color:var(--steel)}
.check.note-flag{background:var(--ink);color:#fff;width:100%;text-align:left;
  font-family:var(--body);align-items:center}
.check.note-flag .tag{background:var(--red);color:#fff}
.check.note-flag:active{opacity:.85}
.check.info .tag{background:var(--steel);color:#fff}
.check.ok .tag{background:var(--good);color:#fff}

/* ---------- Tally ---------- */
table.tally{width:100%;border-collapse:collapse;font-size:14px}
table.tally th{font-family:var(--body);font-weight:600;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mute);text-align:center;padding:0 3px 6px;
  border-bottom:1px solid var(--fog)}
table.tally th.l,table.tally td.l{text-align:left}
table.tally td{padding:7px 3px;text-align:center;border-bottom:1px solid #EEF0F2;
  font-family:var(--mono);font-size:13px}
table.tally td.l{font-family:var(--body);font-size:14px;font-weight:500;white-space:nowrap}
table.tally td.z{color:#C3C8CE}
table.tally tr.flag td.l{color:var(--red-deep);font-weight:600}
.bar{display:inline-block;height:7px;border-radius:4px;background:var(--red);vertical-align:1px}
.bar.g{background:var(--steel)}
.bar.m{background:var(--fog)}

/* ---------- Roster ---------- */
.plist{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pchip{display:flex;align-items:center;gap:8px;border:1px solid var(--fog);border-radius:9px;
  padding:9px 10px;background:#fff;text-align:left;width:100%}
.pchip .nm{font-weight:600;font-size:15px;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pchip .st{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:2px 5px;
  border-radius:4px;flex:none}
.pchip.in{border-color:var(--fog)}
.pchip.in .st{background:var(--good-wash);color:var(--good)}
.pchip.out{background:#F7F8F9;border-style:dashed}
.pchip.out .nm{color:var(--mute);text-decoration:line-through}
.pchip.out .st{background:var(--fog);color:var(--steel)}
.countline{font-family:var(--mono);font-size:12px;color:var(--steel);margin-bottom:9px}

/* ---------- Batting ---------- */
.bat{display:flex;align-items:center;gap:10px;border:1px solid var(--fog);border-radius:9px;
  padding:7px 9px;margin-bottom:6px;background:#fff}
.bat .num{font-family:var(--disp);font-weight:700;font-size:19px;color:#fff;background:var(--red);
  width:29px;height:29px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  flex:none;transform:skewX(-8deg)}
.bat .num i{transform:skewX(8deg);font-style:normal}
.bat .nm{flex:1;font-weight:600;font-size:16px}
.bat .mv{border:1px solid var(--fog);border-radius:7px;width:36px;height:34px;
  font-size:15px;color:var(--steel);background:#fff}
.bat .mv:disabled{opacity:.3}

/* ---------- Misc controls ---------- */
.seg{display:flex;border:1px solid var(--fog);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:9px 4px;font-family:var(--disp);font-weight:600;font-size:14px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--steel);background:#fff;
  border-right:1px solid var(--fog)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--red);color:#fff}

.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}   /* wraps to its own line rather than overlapping */
label.f{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mute);font-weight:600;margin-bottom:4px}
input.t,select.t,textarea.t{width:100%;max-width:100%;min-width:0;border:1px solid var(--fog);
  border-radius:8px;padding:9px 10px;background:#fff;display:block}
/* iOS gives date inputs an intrinsic width and ignores width:100% until the
   native appearance is removed — without this the field overruns its column. */
input[type="date"].t{-webkit-appearance:none;appearance:none;height:40px;line-height:20px}
select.t{-webkit-appearance:none;appearance:none;padding-right:26px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M1 1l4 4 4-4' stroke='%238B939C' stroke-width='1.6' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center}
textarea.t{resize:vertical;font-size:16px;line-height:1.4}
.btn{border:1px solid var(--fog);background:#fff;border-radius:8px;padding:10px 13px;
  font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{color:var(--steel)}
.btn.danger{color:var(--red-deep);border-color:#F0C6CC}
.hint{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.4}
.empty{text-align:center;color:var(--mute);padding:22px 10px;font-size:14px}

.note{border:1px solid var(--fog);border-left:3px solid var(--steel);border-radius:9px;
  padding:9px 11px;margin-bottom:8px;background:#fff}
.note.mine{border-left-color:var(--red);background:#FFFCFC}
.nmeta{font-size:11px;color:var(--mute);font-family:var(--mono);letter-spacing:.04em;
  margin-bottom:4px;display:flex;gap:6px;align-items:baseline}
.nmeta b{color:var(--ink);font-family:var(--body);font-size:13px;letter-spacing:0}
.nmeta span{margin-left:auto}
.ntext{font-size:15px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.ndel{font-size:11px;color:var(--mute);padding:6px 0 0;letter-spacing:.04em;text-transform:uppercase}

table.diag{width:100%;border-collapse:collapse;font-size:13px}
table.diag td{padding:6px 0;border-bottom:1px solid #EEF0F2;font-family:var(--mono);font-size:12px}
table.diag td:first-child{color:var(--mute);width:38%;font-family:var(--body);font-size:13px}
.pulse{animation:pulse 1.4s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,16,46,.45)}100%{box-shadow:0 0 0 14px rgba(200,16,46,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;border-color:var(--red)}}
.log{margin-top:9px;padding:8px 9px;background:#F7F8F9;border-radius:7px;
  font-family:var(--mono);font-size:10.5px;line-height:1.6;color:var(--steel);
  max-height:150px;overflow:auto}
.stamp{text-align:center;font-family:var(--mono);font-size:10px;color:#A8AFB7;
  letter-spacing:.06em;padding:6px 0 0}

/* ---------- Game-day display ----------
   Sized in viewport units so an iPad on the fence fills the screen without
   scrolling, at whatever resolution it happens to be. */
#display{display:none}
body.display-on{overflow:hidden;background:var(--ink)}
body.display-on #chrome,body.display-on .top,body.display-on .tabs,
body.display-on .wrap,body.display-on .stamp{display:none!important}
body.display-on #display{display:block}
.dwrap{height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:1.4vh 1.6vh;gap:1.2vh;color:#fff;
  padding-top:calc(1.4vh + env(safe-area-inset-top))}
.dhead{display:flex;align-items:center;gap:1.4vh;flex:none}
.dhead img{width:6vh;height:6vh;border-radius:50%;background:#fff;padding:.3vh;flex:none}
.dtitle{font-family:var(--disp);font-weight:700;font-size:4vh;letter-spacing:.04em;
  text-transform:uppercase;line-height:1}
.dtitle span{color:#9AA2AB}
.dmeta{font-family:var(--mono);font-size:1.7vh;color:#9AA2AB;margin-top:.4vh;letter-spacing:.06em}
.dha{background:var(--red);color:#fff;padding:.2vh .9vh;border-radius:.4vh;margin-left:.8vh;
  font-weight:600;letter-spacing:.08em}
.dinn{margin-left:auto;display:flex;align-items:center;gap:1.2vh;flex:none}
.dinn button{width:7vh;height:7vh;border-radius:1.2vh;background:#31353C;color:#fff;
  font-size:3vh;line-height:1;border:1px solid #454B54}
.dinn button:disabled{opacity:.3}
.dinn .now{text-align:center;min-width:11vh}
.dinn .now b{display:block;font-family:var(--disp);font-weight:700;font-size:6vh;
  line-height:1;color:var(--red)}
.dinn .now span{font-family:var(--mono);font-size:1.5vh;color:#9AA2AB;letter-spacing:.1em}
.dclose{position:absolute;top:calc(1vh + env(safe-area-inset-top));right:1.2vh;
  width:4.4vh;height:4.4vh;border-radius:50%;background:#31353C;color:#9AA2AB;font-size:2.2vh}

.dbody{flex:1;display:flex;gap:1.4vh;min-height:0}
.dbat{flex:0 0 26%;background:#2B2F35;border-radius:1.4vh;padding:1vh;
  display:flex;flex-direction:column;min-height:0}
.dbat h3,.dgrid h3{font-family:var(--disp);font-weight:600;font-size:1.9vh;letter-spacing:.12em;
  text-transform:uppercase;color:#9AA2AB;margin:.2vh 0 .8vh;flex:none}
.dbatlist{flex:1;display:flex;flex-direction:column;gap:.35vh;min-height:0}
.dbatrow{display:flex;align-items:center;gap:.9vh;flex:1;min-height:0;
  background:#33373E;border-radius:.8vh;padding:0 1vh}
.dbatrow .n{font-family:var(--mono);font-size:2vh;color:#8B939C;width:3vh;flex:none}
.dbatrow .nm{font-weight:600;font-size:2.5vh;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.dbatrow .pz{font-family:var(--disp);font-weight:700;font-size:2.2vh;letter-spacing:.04em;
  color:#fff;background:var(--red);border-radius:.6vh;padding:.2vh 1vh;flex:none}
.dbatrow .pz.bn{background:#565D66;color:#C9CFD6}

.dgrid{flex:1;background:#2B2F35;border-radius:1.4vh;padding:1vh;display:flex;
  flex-direction:column;min-width:0}
table.dtab{width:100%;height:100%;border-collapse:collapse;table-layout:fixed}
table.dtab th,table.dtab td{text-align:center;font-size:2.2vh;padding:.2vh .3vh;
  border-bottom:1px solid #3C4148;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
table.dtab th{font-family:var(--mono);font-size:1.7vh;color:#8B939C;letter-spacing:.06em}
table.dtab td.pos,table.dtab th.pos{font-family:var(--disp);font-weight:700;font-size:2.3vh;
  color:#9AA2AB;text-align:left;width:7%;letter-spacing:.04em}
table.dtab td.live{background:#3E2429;color:#fff;font-weight:600}
table.dtab th.live{color:var(--red)}
table.dtab tr.bn td{font-size:1.8vh;color:#9AA2AB}
table.dtab tr.bn td.live{color:#fff}

/* ---------- Print sheet ---------- */
#print{display:none}
@media print{
  @page{size:landscape;margin:.3in}
  /* The rule above is the default for print started from the browser's own
     menu. fitPrint injects a later @page that overrides it when rotating, so
     orientation always agrees
     with whether the sheet is being rotated. Geometry is measured, never
     assumed: a hard-coded page size overflowed and sliced off the batting
     column on a second phone. */
  .psheet{transform-origin:0 0}
  body.rot .psheet{position:absolute;top:0;left:0}
  body{background:#fff}
  #chrome,.top,.tabs,.wrap,.noprint{display:none!important}
  #print{display:block!important}
  .psheet{font-family:var(--body);color:#000}
  .phead{display:flex;align-items:center;gap:9px;border-bottom:3px solid #C8102E;
    padding-bottom:4px;margin-bottom:7px}

    -webkit-print-color-adjust:exact;print-color-adjust:exact}

    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pcols{display:flex;gap:12px;align-items:flex-start}
  table.pgrid{border-collapse:collapse;flex:1 1 auto}
  table.pgrid th,table.pgrid td{border:1px solid #666;padding:3px 4px;font-size:10.5pt;
    text-align:center;white-space:nowrap}
  table.pgrid th{background:#E6E7E9;font-family:var(--disp);font-weight:700;font-size:11pt;
    letter-spacing:.04em}
  table.pgrid td.pos{background:#F0F1F2;font-family:var(--disp);font-weight:700;
    font-size:11.5pt;text-align:left;letter-spacing:.03em}
  table.pgrid tr.pbench td{font-size:9.5pt;font-style:italic;background:#FAFAFA}
  table.pbat{border-collapse:collapse;flex:0 0 auto;width:auto}
  table.pbat th{border:1px solid #666;background:#C8102E;color:#fff;font-family:var(--disp);
    font-size:11pt;letter-spacing:.05em;padding:3px 8px;text-transform:uppercase}
  table.pbat td{border:1px solid #666;padding:2.5px 8px;font-size:10.5pt;white-space:nowrap}
  table.pbat td.n{font-family:var(--mono);font-weight:600;text-align:center;background:#F0F1F2}
  .pfoot{margin-top:6px;font-size:8.5pt;color:#444;display:flex;gap:14px}
}

/* ==== LOGIC:BEGIN ====  (extracted verbatim by warriors-tests.js — no DOM in here) */

/* ---------------- Constants ---------------- */
const POS = [
  {k:"P",  label:"Pitcher",   grp:"INF"},
  {k:"C",  label:"Catcher",   grp:"INF"},
  {k:"1B", label:"First",     grp:"INF"},
  {k:"2B", label:"Second",    grp:"INF"},
  {k:"3B", label:"Third",     grp:"INF"},
  {k:"SS", label:"Short",     grp:"INF"},
  {k:"LF", label:"Left",      grp:"OF"},
  {k:"CF", label:"Center",    grp:"OF"},
  {k:"RF", label:"Right",     grp:"OF"}
];
const POSK = POS.map(p=>p.k);
const GRP = Object.fromEntries(POS.map(p=>[p.k,p.grp]));
const FIELD_N = POS.length;

/* ---------------- Seed data ---------------- */
const SEED_NAMES = ["Cole","Max O","Leo","Rex","Dawson","Micah","Ryder","Cooper","Owen","Huddy","Blake","Isaac"];
const pid = n => "p_" + n.toLowerCase().replace(/[^a-z0-9]/g,"");

const SEED_ROSTER = SEED_NAMES.map(n=>({id:pid(n),name:n}));

// 8/22/26 lineup, transcribed from the spreadsheet. Isaac was out.
const G822 = {
  "1B":["Blake","Leo","Max O","Micah","Dawson","Micah"],
  "2B":["Huddy","Ryder","Cooper","Cole","Max O","Cole"],
  "SS":["Cooper","Rex","Rex","Ryder","Cole","Dawson"],
  "3B":["Max O","Owen","Ryder","Rex","Cooper","Max O"],
  "LF":["Rex","Max O","Leo","Dawson","Rex","Cooper"],
  "CF":["Ryder","Cole","Cole","Cooper","Micah","Ryder"],
  "RF":["Owen","Huddy","Owen","Leo","Blake","Huddy"],
  "P" :["Micah","Micah","Blake","Blake","Owen","Owen"],
  "C" :["Dawson","Dawson","Huddy","Huddy","Leo","Leo"]
};
function seedGame(){
  const slots={};
  for(const p in G822) G822[p].forEach((nm,i)=>{ slots["i"+(i+1)+"_"+p]=pid(nm); });
  return {
    id:"g_20260822", date:"2026-08-22", opp:"", innings:6,
    out:[pid("Isaac")],
    order:["Cole","Max O","Leo","Rex","Dawson","Micah","Ryder","Cooper","Owen","Huddy","Blake"].map(pid),
    slots, done:true, created:Date.parse("2026-08-22")
  };
}

/* ---------------- State ---------------- */
let S = { roster:[], games:[], notes:[], coaches:[], cur:null };
let ME = null;                 // whoever this device belongs to — no accounts
let notesSeen = 0;

/* ---------------- Helpers ---------------- */
const byId = id => S.roster.find(p=>p.id===id);
const nameOf = id => (byId(id)||{}).name || "?";
const game = () => S.games.find(g=>g.id===S.cur) || null;
const present = g => S.roster.filter(p=>!(g.out||[]).includes(p.id));
const key = (i,p) => "i"+i+"_"+p;

/* Two cards per game. `slots` is the pregame plan, kept as a record. `actual`
   is the game-day card and only exists once something is changed during the
   game. Stats read ONE of them — actual when present, otherwise the plan — so
   a game can never be counted twice, and games played before this existed need
   no migration: with no `actual`, the plan simply is the game-day card. */
const hasActual = g => !!(g.actual && Object.keys(g.actual).length);
const effCard   = g => hasActual(g) ? g.actual : g.slots;
const planCard  = g => g.slots;
const cardDiff  = g => {
  if(!hasActual(g)) return 0;
  const keys = new Set([...Object.keys(g.slots||{}), ...Object.keys(g.actual||{})]);
  let n=0; keys.forEach(k=>{ if((g.slots||{})[k] !== (g.actual||{})[k]) n++; });
  return n;
};
const innings = g => Array.from({length:g.innings||6},(_,i)=>i+1);
/* Time limits end games early. `played` records how many innings actually
   happened; everything that measures what a kid DID uses this, so nobody is
   credited with an inning the umpire called off. The card itself is still
   built for the full scheduled length. */
const scoredInnings = g => {
  const n = parseInt(g.played,10);
  const planned = g.innings||6;
  return Number.isFinite(n) && n>0 ? Math.min(n, planned) : planned;
};
const scoredList = g => Array.from({length:scoredInnings(g)},(_,i)=>i+1);
const endedEarly = g => scoredInnings(g) < (g.innings||6);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = d => { if(!d) return "TBD";
  const [y,m,day]=d.split("-"); return m.replace(/^0/,"")+"/"+day.replace(/^0/,"")+"/"+y.slice(2); };

function assignedIn(g,i,card){
  const c = card || effCard(g);
  const map={};
  POSK.forEach(p=>{ const v=c[key(i,p)]; if(v) map[p]=v; });
  return map;
}
function benchIn(g,i,card){
  const used = new Set(Object.values(assignedIn(g,i,card)));
  return present(g).filter(p=>!used.has(p.id));
}
function dupsIn(g,i,card){
  const c = card || effCard(g);
  const seen={}, dup=new Set();
  POSK.forEach(p=>{ const v=c[key(i,p)]; if(!v) return;
    if(seen[v]) dup.add(v); seen[v]=1; });
  return dup;
}

/* Per-player counts for one game */
function tallyGame(g, card){
  const c = card || effCard(g);
  const t={};
  present(g).forEach(p=>{ t[p.id]={INF:0,OF:0,BN:0,pos:{}}; });
  scoredList(g).forEach(i=>{
    const a=assignedIn(g,i,c);
    POSK.forEach(p=>{
      const v=a[p]; if(!v||!t[v]) return;
      t[v][GRP[p]]++; t[v].pos[p]=(t[v].pos[p]||0)+1;
    });
    benchIn(g,i,c).forEach(p=>{ if(t[p.id]) t[p.id].BN++; });
  });
  return t;
}

/* Counts across a set of games */
function tallyMany(list){
  const t={};
  S.roster.forEach(p=>{ t[p.id]={INF:0,OF:0,BN:0,pos:{},games:0}; });
  list.forEach(g=>{
    const one=tallyGame(g);
    for(const id in one){
      if(!t[id]) continue;
      t[id].games++;
      t[id].INF+=one[id].INF; t[id].OF+=one[id].OF; t[id].BN+=one[id].BN;
      for(const p in one[id].pos) t[id].pos[p]=(t[id].pos[p]||0)+one[id].pos[p];
    }
  });
  return t;
}

/* Prior game (chronologically before current) */
function priorGames(){
  const g=game(); if(!g) return [];
  return S.games.filter(x=>x.id!==g.id && (x.created||0) < (g.created||0))
                .sort((a,b)=>(b.created||0)-(a.created||0));
}

/* ---------------- Checks ---------------- */
function runChecks(card){
  const g=game(); if(!g) return [];
  const c = card || effCard(g);
  const out=[], pres=present(g), n=pres.length;

  if(n < FIELD_N){
    out.push({lv:"err",tag:"SHORT",msg:`Only ${n} players in. You need ${FIELD_N} to field a full defense.`});
  }

  // per-inning integrity
  const dupInn=[], holeInn=[];
  scoredList(g).forEach(i=>{
    const d=dupsIn(g,i,c);
    if(d.size) dupInn.push(`Inn ${i}: ${[...d].map(nameOf).join(", ")}`);
    const a=assignedIn(g,i,c);
    const holes=POSK.filter(p=>!a[p]);
    if(holes.length) holeInn.push(`Inn ${i}: ${holes.join(", ")}`);
    // a player marked out who is still on the card
    Object.values(a).forEach(v=>{
      if((g.out||[]).includes(v))
        out.push({lv:"err",tag:"OUT",msg:`${nameOf(v)} is marked missing but is still in inning ${i}.`});
    });
  });
  if(dupInn.length) out.push({lv:"err",tag:"DOUBLE",msg:"Same player twice in one inning — "+dupInn.join(" · ")});
  if(holeInn.length) out.push({lv:"err",tag:"HOLE",msg:"Position not filled — "+holeInn.join(" · ")});

  // fairness
  const t=tallyGame(g,c);
  const prev=priorGames()[0];
  const pt=prev?tallyGame(prev):null;

  /* With 11 players over 6 innings there are 12 bench slots, so somebody has to
     sit twice no matter how you arrange it. Warn only when a kid sits MORE than
     the roster forces; report the forced case as information, not a problem. */
  const benchTotal = Math.max(0, n - FIELD_N) * scoredInnings(g);
  const share = n ? Math.ceil(benchTotal / n) : 0;

  const overBench=[], atBench=[], bench2b2=[], of3=[], samePos=[];
  pres.forEach(p=>{
    const r=t[p.id]; if(!r) return;
    if(r.BN > share) overBench.push(p.name);
    else if(r.BN >= 2 && r.BN === share) atBench.push(p.name);
    if(r.BN >= 2 && pt && pt[p.id] && pt[p.id].BN >= 2) bench2b2.push(p.name);
    if(r.OF >= 3) of3.push(p.name);
    for(const k in r.pos) if(r.pos[k] >= 3) samePos.push(`${p.name} at ${k} \u00d7${r.pos[k]}`);
  });

  // Who drew the short straw last time is the thing you want in front of you
  // while building today's card, not only after you have repeated it.
  const prevSat = [];
  if(prev && pt){
    pres.forEach(p=>{
      const r = pt[p.id];
      if(r && r.BN >= 2 && !bench2b2.includes(p.name)) prevSat.push(p.name);
    });
  }

  if(overBench.length) out.push({lv:"warn",tag:"BENCH "+(share+1)+"+",
    msg:`Sitting more than a fair share (${share} each with ${n} in): ${overBench.join(", ")}.`});
  if(bench2b2.length) out.push({lv:"warn",tag:"SAT 2\u00d72",
    msg:`Sat twice last game and again today: ${bench2b2.join(", ")}. Move the second sit to someone who hasn't had one.`});
  if(prevSat.length) out.push({lv:"info",tag:"LAST GAME",
    msg:`Sat twice on ${fmtDate(prev.date)}: ${prevSat.join(", ")}. Someone has to sit twice today \u2014 make it someone else.`});
  if(atBench.length && !bench2b2.length) out.push({lv:"info",tag:"SITS "+share,
    msg:`${n} players means someone sits ${share}\u00d7. Today it's ${atBench.join(", ")}.`});
  if(endedEarly(g)) out.push({lv:"info",tag:"SHORT GAME",
    msg:`Counting ${scoredInnings(g)} of ${g.innings} innings \u2014 the rest aren't in the totals.`});
  if(of3.length) out.push({lv:"warn",tag:"OF 3+",
    msg:`Three or more innings in the outfield: ${of3.join(", ")}.`});
  if(samePos.length) out.push({lv:"warn",tag:"SAME POS",
    msg:"Same spot three or more innings \u2014 "+samePos.join(" \u00b7 ")});

  if(!out.some(c=>c.lv==="err"||c.lv==="warn"))
    out.push({lv:"ok",tag:"SET",msg:`Card is clean. ${n} players, ${scoredInnings(g)} innings, every spot covered.`});
  return out;
}
const errCount = card => runChecks(card).filter(c=>c.lv==="err").length;

/* The live inning is stored on the game document so every device agrees:
   advance it on a phone and the iPad on the fence follows. */
function liveInning(g){
  const n = Math.max(1, Math.min(g.innings||6, parseInt(g.now,10)||1));
  return n;
}
/* Home or away changes how the matchup reads and who bats first. Games from
   before this field existed have no value, so "unset" stays a real state. */
const isAway  = g => g.ha === "away";
const vsLabel = g => g.opp ? ((isAway(g) ? "@ " : "vs ") + g.opp) : "";
const batsFirst = g => g.ha==="away" ? "Warriors bat first" : g.ha==="home" ? "Warriors field first" : "";

function posOf(g, inning, id, card){
  const a = assignedIn(g, inning, card);
  for(const p of POSK) if(a[p]===id) return p;
  return null;
}

/* ---------------- Import ----------------
   Tolerant of the spreadsheet's real shape: a position code somewhere in the
   row, then one name per inning. Extra columns (batting numbers, the repeated
   position label, the tally columns) are skipped rather than fought with. */
const normName = s => String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
const BENCH_WORDS = ["BENCH","BN","SIT","OUT"];

function editDistance(a,b){
  if(a===b) return 0;
  const m=a.length, n=b.length;
  if(!m||!n) return m||n;
  let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}

/* Sheets carry typos — "Issac" for "Isaac". Accept a near miss when exactly one
   roster name is close, and report it so the reading can be checked rather than
   trusted blindly. */
function resolveName(raw, index){
  const n = normName(raw);
  if(!n) return {};
  if(index.map[n]) return {id:index.map[n]};
  let best=null, bestD=99, ties=0;
  index.list.forEach(e=>{
    const d = editDistance(n, e.norm);
    if(d < bestD){ bestD=d; best=e; ties=1; }
    else if(d === bestD) ties++;
  });
  const allow = n.length <= 4 ? 1 : 2;
  if(best && bestD <= allow && ties === 1) return {id:best.id, fuzzy:best.name};
  return {};
}

function parseLineup(text, innCount){
  const index = {map:{}, list:[]};
  S.roster.forEach(p=>{
    const n = normName(p.name);
    index.map[n] = p.id;
    index.list.push({id:p.id, norm:n, name:p.name});
  });

  const slots={}, unknown=new Set(), fuzzy=[], seen={};
  const benched = new Set();
  let order=[];

  const take = raw => {
    const r = resolveName(raw, index);
    if(r.fuzzy) fuzzy.push({from:raw, to:r.fuzzy});
    if(!r.id) unknown.add(raw);
    return r.id || null;
  };

  String(text).split(/\r?\n/).forEach(line=>{
    const cells = line.split(/[,\t]/).map(c=>c.trim().replace(/^"|"$/g,""));

    // batting order: a row number followed by a roster name
    if(/^\d{1,2}$/.test(cells[0]||"") && cells[1]){
      const r = resolveName(cells[1], index);
      if(r.id && !order.includes(r.id)) order.push(r.id);
    }

    const at = cells.findIndex(c=>
      POSK.includes(c.toUpperCase()) || BENCH_WORDS.includes(c.toUpperCase()));
    if(at < 0) return;
    const label = cells[at].toUpperCase();
    const isBench = BENCH_WORDS.includes(label);
    if(!isBench && seen[label]) return;

    const names=[];
    for(let i=at+1; i<cells.length && names.length<innCount; i++){
      const c=cells[i];
      if(c==="") { if(names.length) break; continue; }
      if(/^\d+$/.test(c)) break;                                   // tally columns
      if(POSK.includes(c.toUpperCase())) break;                    // repeated label
      if(BENCH_WORDS.includes(c.toUpperCase())) break;
      names.push(c);
    }
    if(!names.length) return;

    if(isBench){
      // Bench rows are not stored — bench is derived — but they prove attendance.
      // Without this a kid who sat every inning would be recorded as absent.
      // They only corroborate, so anything unresolvable here is ignored rather
      // than reported: the header row also carries a "Bench" column label.
      names.forEach(nm=>{
        const r = resolveName(nm, index);
        if(!r.id) return;
        if(r.fuzzy && !fuzzy.some(f=>f.from===nm)) fuzzy.push({from:nm, to:r.fuzzy});
        benched.add(r.id);
      });
      return;
    }

    seen[label]=1;
    names.forEach((nm,idx)=>{
      const id = take(nm);
      if(id) slots[key(idx+1,label)] = id;
    });
  });

  const appeared = new Set([...Object.values(slots), ...benched]);
  const out = S.roster.filter(p=>!appeared.has(p.id)).map(p=>p.id);
  order = order.filter(id=>!out.includes(id));

  return {
    slots, out, order, benchOnly:[...benched].filter(id=>!Object.values(slots).includes(id)),
    positions: Object.keys(seen).length,
    filled: Object.keys(slots).length,
    expected: POSK.length * innCount,
    unknown: [...unknown],
    fuzzy
  };
}

/* ==== LOGIC:END ==== */

let tab = "lineup";

/* ---------------- Local cache (mirror of the server, never the source of truth) --- */
const LS = "warriors_lineup_v1";
function saveLocal(){
  try{ localStorage.setItem(LS, JSON.stringify({schema:SCHEMA,roster:S.roster,games:S.games,notes:S.notes,coaches:S.coaches})); }
  catch(e){ note("cache write failed: "+codeOf(e)); }
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.roster)) return false;
    if((d.schema||0) !== SCHEMA){ note("cache written under schema "+(d.schema||0)+", ignored"); return false; }
    S.roster = d.roster; S.games = d.games||[]; S.notes = d.notes||[]; S.coaches = d.coaches||[];
    return true;
  }catch(e){ note("cache read failed: "+codeOf(e)); return false; }
}

/* ---------------- Sync status ----------------
   Rule learned the hard way on the EI app: never report a bare "offline".
   Every failure carries a code, and the Game tab shows the last one. */
const SYNC = { mode:"local", detail:"this device only", pending:0, lastAt:null, lastErr:null, log:[] };
const codeOf = e => (e && (e.code || e.name)) || "unknown";
function note(msg){
  SYNC.log.unshift(new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit",second:"2-digit"})+"  "+msg);
  SYNC.log = SYNC.log.slice(0,12);
}
function setSync(mode, detail, err){
  SYNC.mode = mode;
  if(detail !== undefined) SYNC.detail = detail;
  if(err){ SYNC.lastErr = codeOf(err)+": "+(err.message||""); note(detail+" — "+SYNC.lastErr); }
  paintSync();
}
function paintSync(){
  const a=document.getElementById("syncState"), b=document.getElementById("syncNote");
  if(!a) return;
  a.textContent = {local:"Local",connecting:"Linking",live:"Live",error:"Error"}[SYNC.mode] || SYNC.mode;
  a.style.color = SYNC.mode==="error" ? "#FF8A93" : SYNC.mode==="live" ? "#fff" : "#C9CFD6";
  const btn=document.getElementById("syncBtn");
  if(btn) btn.classList.toggle("err", SYNC.mode==="error");
  let d = SYNC.detail;
  if(SYNC.mode==="live"){
    d = SYNC.pending ? SYNC.pending+" saving…"
      : SYNC.lastAt ? new Date(SYNC.lastAt).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})
      : "connected";
  }
  b.textContent = d;
}

/* ---------------- Mutations ----------------
   Each edit writes only the field it touched. Two coaches editing different
   cells in the same inning both survive; a whole-document write would have
   let the slower phone erase the faster one. */
function commit(){ saveLocal(); render(); }

let cardMode = "plan";        // "plan" = pregame, "live" = game day

function setSlot(i,p,val){
  const g=game(); const k=key(i,p);
  if(cardMode === "live"){
    if(!hasActual(g)){
      // First game-day change forks the plan. Copying it whole keeps the two
      // cards independent, so a later plan edit cannot leak into the record.
      g.actual = Object.assign({}, g.slots);
      writeGameField(g.id, "actual", g.actual);
      note("game-day card started from the pregame plan");
    }
    if(val) g.actual[k]=val; else delete g.actual[k];
    commit();
    writeGameField(g.id, "actual."+k, val || DELETE);
  }else{
    if(val) g.slots[k]=val; else delete g.slots[k];
    commit();
    writeGameField(g.id, "slots."+k, val || DELETE);
  }
}
function toggleOut(id){
  const g=game(); g.out=g.out||[];
  if(g.out.includes(id)){
    g.out=g.out.filter(x=>x!==id);
    if(!g.order.includes(id)) g.order.push(id);
  }else{
    g.out.push(id);
    g.order=g.order.filter(x=>x!==id);
    Object.keys(g.slots).forEach(k=>{ if(g.slots[k]===id) delete g.slots[k]; });
    if(g.actual) Object.keys(g.actual).forEach(k=>{ if(g.actual[k]===id) delete g.actual[k]; });
  }
  commit();
  writeGame(g);
}
function moveBat(id,dir){
  const g=game(), o=g.order, i=o.indexOf(id), j=i+dir;
  if(i<0||j<0||j>=o.length) return;
  [o[i],o[j]]=[o[j],o[i]];
  commit();
  writeGameField(g.id, "order", o.slice());
}

/* ---------------- Notes ----------------
   Two coaches, no accounts. Each device says who it is once; that name is
   stamped on anything written from it. */
/* Names are not hard-coded. The list is whatever has been used before, from
   the shared list and from the notes themselves, plus anyone new who types
   their name in. */
const coachNames = () => {
  const set = new Set();
  (S.coaches||[]).forEach(n=>{ if(n) set.add(n); });
  (S.notes||[]).forEach(n=>{ if(n.who) set.add(n.who); });
  return [...set].sort((a,b)=>a.localeCompare(b));
};
function addCoach(name){
  const nm = String(name||"").trim().slice(0,24);
  if(!nm) return;
  if(!(S.coaches||[]).some(c=>c.toLowerCase()===nm.toLowerCase())){
    S.coaches = [...(S.coaches||[]), nm];
    saveLocal(); writeCoaches();
  }
  setMe(nm);
}
function loadMe(){
  try{ ME = localStorage.getItem(LS+"_me") || null; }catch(e){ ME=null; }
  try{ notesSeen = +(localStorage.getItem(LS+"_seen")||0); }catch(e){ notesSeen=0; }
}
function setMe(who){
  ME = who;
  try{ localStorage.setItem(LS+"_me", who); }catch(e){}
  render();
}
function markNotesRead(){
  notesSeen = Date.now();
  try{ localStorage.setItem(LS+"_seen", String(notesSeen)); }catch(e){}
}
const sortedNotes = () => [...(S.notes||[])].sort((a,b)=>(b.at||0)-(a.at||0));
const unreadNotes = () => (S.notes||[]).filter(n=>(n.at||0) > notesSeen && n.who !== ME).length;

function addNote(text){
  const n = { id:"n_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
              who: ME || "Coach", text: String(text).trim(), at: Date.now(),
              game: S.cur || "" };
  if(!n.text) return;
  S.notes = [n, ...(S.notes||[])];
  markNotesRead(); commit(); writeNote(n);
}
function dropNote(id){
  S.notes = (S.notes||[]).filter(n=>n.id!==id);
  commit(); removeNote(id);
}
const whenStr = ms => {
  if(!ms) return "";
  const d=new Date(ms), now=new Date();
  const sameDay = d.toDateString()===now.toDateString();
  const t=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  return sameDay ? t : d.toLocaleDateString([],{month:"numeric",day:"numeric"})+" "+t;
};

/* ---------------- Render ---------------- */
let displayMode = false;

function measureChrome(){
  const c = document.getElementById("chrome");
  const h = c && c.offsetHeight ? c.offsetHeight : 0;
  document.documentElement.style.setProperty("--chrome-h", h+"px");
}
window.addEventListener("resize", measureChrome);
window.addEventListener("orientationchange", ()=>setTimeout(measureChrome, 200));

function render(){
  if(displayMode){ renderDisplay(); renderPrint(); measureChrome(); return; }
  renderTabs();
  const g=game();
  const v=document.getElementById("view");
  if(!g){ v.innerHTML=`<div class="card"><div class="empty">No game yet. Tap <b>+ Game</b> to start a card.</div></div>`; return; }
  v.innerHTML = ({
    lineup:viewLineup, who:viewWho, bat:viewBat, trends:viewTrends, notes:viewNotes, game:viewGame
  }[tab])(g);
  renderPrint();
  const st=document.getElementById("stamp");
  if(st) st.textContent="BUILD "+BUILD+"  ·  SCHEMA "+SCHEMA;
}

function renderTabs(){
  const g0=game();
  const e=g0?errCount(cardMode==="live"?effCard(g0):planCard(g0)):0;
  const items=[
    ["lineup","Lineup", e?e:0],
    ["who","Who's In",0],
    ["bat","Batting",0],
    ["trends","Trends",0],
    ["notes","Notes",unreadNotes()],
    ["game","Game",0]
  ];
  document.getElementById("tabs").innerHTML = items.map(([k,l,b])=>
    `<button class="tab ${k===tab?"on":""}" data-tab="${k}">${l}${b?`<span class="badge">${b}</span>`:""}</button>`
  ).join("");
}

/* --- Lineup --- */
function viewLineup(g){
  const pres=present(g);
  const card  = cardMode==="live" ? effCard(g) : planCard(g);
  const diffs = cardDiff(g);
  const opts = id => `<option value="">—</option>` + pres.map(p=>
      `<option value="${p.id}" ${p.id===id?"selected":""}>${esc(p.name)}</option>`).join("");

  const head = innings(g).map(i=>{
    const filled=Object.keys(assignedIn(g,i,card)).length;
    const done=filled===FIELD_N && !dupsIn(g,i,card).size;
    return `<th class="inhead ${done?"done":""}"><div class="n">${i}</div>
      <div class="dots">${Array.from({length:FIELD_N},(_,x)=>
        `<span class="dot ${x<filled?"f":""}"></span>`).join("")}</div></th>`;
  }).join("");

  const rows = POS.map(p=>{
    const cells = innings(g).map(i=>{
      const val=card[key(i,p.k)]||"";

    return `<tr><th class="poscell">${p.k}<small>${p.label}</small></th>${cells}</tr>`;
  }).join("");

  const bench = innings(g).map(i=>{
    const b=benchIn(g,i,card);
    return `<td class="benchnames ${b.length?"":"none"}">${b.length?b.map(x=>esc(x.name)).join("<br>"):"—"}</td>`;
  }).join("");

  const unread = unreadNotes();
  const noteFlag = unread ? `<button class="check note-flag" data-tab="notes">
      <span class="tag">${unread} NEW</span>
      <span>${unread===1?"A note you haven't read":"Notes you haven't read"}. Tap to open.</span>
    </button>` : "";
  const checks = noteFlag + runChecks(card).map(c=>
    `<div class="check ${c.lv}"><span class="tag">${c.tag}</span><span>${esc(c.msg)}</span></div>`).join("");

  return `
  <div class="split">
  <div class="splitmain">
  <div class="card">
    <div class="h">Defense <span class="rule"></span>
      ${g.ha?`<span class="hachip ${isAway(g)?"away":"home"}">${isAway(g)?"Away":"Home"}</span>`:""}
      <span style="font-family:var(--mono);font-size:11px;color:var(--mute)">${pres.length} IN · ${g.innings} INN</span></div>
    ${(g.opp||g.ha)?`<div class="matchup">${esc(g.opp?vsLabel(g):(isAway(g)?"Away game":"Home game"))}${
      g.ha?` · <span>${esc(batsFirst(g))}</span>`:""}</div>`:""}
    <div class="cardsw">
      <div class="seg">
        <button class="${cardMode==="plan"?"on":""}" data-card="plan">Pregame</button>
        <button class="${cardMode==="live"?"on":""}" data-card="live">Game day${
          diffs?` <b>${diffs}</b>`:""}</button>
      </div>
    </div>
    <div class="sub">${cardMode==="live"
      ? (hasActual(g)

    <div class="gridscroll">

        </tbody>

    ${tallyTable(tallyGame(g,card), pres, scoredInnings(g), Math.ceil(Math.max(0,pres.length-FIELD_N)*scoredInnings(g)/Math.max(1,pres.length)))}
    ${cardMode==="plan" && diffs?`<div class="hint" style="color:var(--red-deep)">

function tallyTable(t, people, innTotal, share){
  const rows = people.map(p=>{
    const r=t[p.id]||{INF:0,OF:0,BN:0};
    const w=n=>n?Math.max(6,n*11):0;
    const flag = r.BN>share || r.OF>=3;
    return `<tr class="${flag?"flag":""}">
      <td class="l">${esc(p.name)}</td>
      <td class="${r.INF?"":"z"}">${r.INF}</td>
      <td class="${r.OF?"":"z"}">${r.OF}</td>
      <td class="${r.BN?"":"z"}">${r.BN}</td>
      <td style="text-align:left;width:40%">
        ${r.INF?`<span class="bar" style="width:${w(r.INF)}px"></span>`:""}
        ${r.OF?`<span class="bar g" style="width:${w(r.OF)}px"></span>`:""}
        ${r.BN?`<span class="bar m" style="width:${w(r.BN)}px"></span>`:""}
      </td></tr>`;
  }).join("");
  return `<table class="tally">
    <thead><tr><th class="l">Player</th><th>Inf</th><th>Out</th><th>Bn</th>
    <th class="l" style="padding-left:6px">Mix</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="hint">Pitcher and catcher count as infield. Each player has ${innTotal} innings to split.</div>`;
}

/* --- Who's In --- */
function viewWho(g){
  const out=g.out||[];
  const chips = S.roster.map(p=>{
    const isOut=out.includes(p.id);
    return `<button class="pchip ${isOut?"out":"in"}" data-toggle="${p.id}">
      <span class="nm">${esc(p.name)}</span>
      <span class="st">${isOut?"OUT":"IN"}</span></button>`;
  }).join("");
  const n=S.roster.length-out.length;
  return `
  <div class="card">
    <div class="h">Who's in <span class="rule"></span></div>
    <div class="countline">${n} playing · ${out.length} out · ${Math.max(0,n-FIELD_N)} on the bench each inning</div>
    <div class="plist">${chips}</div>
    <div class="hint">Marking a player out clears them from every inning and drops them from the batting order.</div>
  </div>
  <div class="card">
    <div class="h">Roster <span class="rule"></span></div>
    <div class="row">
      <input class="t" id="newName" placeholder="Add a player">
      <button class="btn" id="addPlayer" style="flex:0 0 auto">Add</button>
    </div>
    <div class="hint" id="rmHint">Removing a player takes them off past games too. ${S.roster.map(p=>
      `<button class="btn ghost" data-remove="${p.id}" style="padding:4px 8px;font-size:12px;margin:4px 4px 0 0">✕ ${esc(p.name)}</button>`).join("")}</div>
  </div>`;
}

/* --- Batting --- */
function viewBat(g){
  const order=(g.order||[]).filter(id=>!(g.out||[]).includes(id) && byId(id));
  present(g).forEach(p=>{ if(!order.includes(p.id)) order.push(p.id); });
  g.order=order;
  const rows=order.map((id,i)=>`
    <div class="bat">
      <div class="num"><i>${i+1}</i></div>
      <div class="nm">${esc(nameOf(id))}</div>
      <button class="mv" data-up="${id}" ${i===0?"disabled":""}>▲</button>
      <button class="mv" data-down="${id}" ${i===order.length-1?"disabled":""}>▼</button>
    </div>`).join("");
  return `<div class="card">
    <div class="h">Batting order <span class="rule"></span>
      <span style="font-family:var(--mono);font-size:11px;color:var(--mute)">${order.length} HITTERS</span></div>
    <div class="sub">Everyone who's in bats, bench or not.</div>
    ${rows||`<div class="empty">Nobody marked in yet.</div>`}
  </div>`;
}

/* --- Trends --- */
function viewTrends(g){
  const prior=priorGames();
  const inc=document.body.dataset.incCur==="1";
  const list=inc?[...prior,g]:prior;
  if(!list.length) return `<div class="card"><div class="empty">
    No earlier games on file yet. Add one under <b>Game</b> to start the history.</div></div>`;

  const t=tallyMany(list);
  const cols=POSK.concat(["BN"]);
  const rows=S.roster.map(p=>{
    const r=t[p.id]; if(!r||!r.games) return "";
    const tot=r.INF+r.OF+r.BN;
    const cells=cols.map(k=>{
      const n = k==="BN" ? r.BN : (r.pos[k]||0);
      return `<td class="${n?"":"z"}">${n}</td>`;
    }).join("");
    const lowOpp = tot && (r.INF/Math.max(1,tot)) < .34;
    return `<tr class="${lowOpp?"flag":""}"><td class="l">${esc(p.name)}</td>${cells}
      <td style="font-weight:600">${r.INF}</td><td style="font-weight:600">${r.OF}</td></tr>`;
  }).join("");

  return `<div class="card">
    <div class="h">Rotation history <span class="rule"></span></div>
    <div class="sub">${list.length} game${list.length>1?"s":""} · innings by position</div>
    <div class="gridscroll">
      <table class="tally" style="width:max-content;min-width:100%">
        <thead><tr><th class="l">Player</th>${cols.map(c=>`<th>${c}</th>`).join("")}
        <th>INF</th><th>OF</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="hint">Names in red have had under a third of their innings in the infield across these games.</div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" id="incCur">${inc?"Hide":"Include"} today's card</button>
    </div>
  </div>
  <div class="card">
    <div class="h">Games counted <span class="rule"></span></div>
    ${list.map(x=>`<div style="font-size:14px;padding:6px 0;border-bottom:1px solid #EEF0F2">
      <b>${fmtDate(x.date)}</b> ${x.opp?"vs "+esc(x.opp):"<span style='color:var(--mute)'>no opponent</span>"}
      ${x.id===g.id?" <span style='color:var(--red);font-size:12px'>· today</span>":""}</div>`).join("")}
  </div>`;
}

/* --- Printing ---------------------------------------------------------
   The sheet is laid out at the printable page size, measured, then scaled
   down if it overruns. Nothing is assumed to fit. Letter and A4 differ, and
   Safari's margins are its own business, so we take the smaller of the two
   printable widths and let the scale absorb the rest. */
const PAGE = { long: 10.0*96, short: 7.5*96 };   // conservative printable area, px @96dpi

function fitPrint(rot){
  const sheet = document.querySelector("#print .psheet");
  if(!sheet) return;
  document.body.classList.toggle("rot", rot);

  // orientation must agree with whether we are turning the sheet
  let st = document.getElementById("pageRule");
  if(!st){ st=document.createElement("style"); st.id="pageRule"; document.head.appendChild(st); }
  st.textContent = "@page{size:"+(rot?"portrait":"landscape")+";margin:.3in}";

  // lay out at the landscape shape either way, then measure
  sheet.style.transform = "none";
  sheet.style.width  = PAGE.long+"px";
  sheet.style.height = "auto";
  const w = Math.max(sheet.scrollWidth, PAGE.long);
  const h = sheet.scrollHeight;
  const scale = Math.min(1, PAGE.long / w, PAGE.short / h);

  // Transforms apply right to left: scale, then rotate, then translate. After a
  // 90deg turn the sheet occupies x from -(h*scale) to 0, so shift right by
  // exactly that to sit flush against the left edge of the page.
  sheet.style.transform = rot
    ? "translate("+(h*scale)+"px,0) rotate(90deg) scale("+scale+")"
    : "scale("+scale+")";
}
function clearPrint(){
  const sheet=document.querySelector("#print .psheet");
  if(sheet){ sheet.style.transform=""; sheet.style.width=""; sheet.style.height=""; }
  document.body.classList.remove("rot");
  const st=document.getElementById("pageRule"); if(st) st.textContent="";
}
/* iOS standalone will build the print sheet but not present it until the view
   is recomposited — which is why backgrounding the app and coming back makes
   the dialog appear. Force a layout flush, let two frames land, and call print
   from outside the touch handler. */
function doPrint(rot){
  renderPrint();
  fitPrint(rot);

  document.body.style.transform = "translateZ(0)";
  void document.body.offsetHeight;               // flush layout
  document.body.style.transform = "";
  void document.body.offsetHeight;

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    setTimeout(()=>{
      try{ window.print(); }
      catch(e){ note("print failed: "+codeOf(e)); }
      setTimeout(clearPrint, 1500);
    }, 80);
  }));
}

window.addEventListener("afterprint", clearPrint);
// Printing from Safari's share sheet never touches our buttons, so fit there too.
window.addEventListener("beforeprint", ()=>{
  const sheet=document.querySelector("#print .psheet");
  if(sheet && !sheet.style.transform){ renderPrint(); fitPrint(false); }
});

function setInning(n){
  const g=game(); if(!g) return;
  g.now = Math.max(1, Math.min(g.innings||6, n));
  saveLocal(); render();
  writeGameField(g.id, "now", g.now);
}

/* Keep the screen awake — an iPad on a fence for two hours will otherwise sleep. */
let wakeLock=null;
async function holdScreen(on){
  try{
    if(on && "wakeLock" in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", ()=>{ wakeLock=null; });
    } else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ note("screen wake lock unavailable: "+codeOf(e)); }
}
document.addEventListener("visibilitychange", ()=>{
  if(displayMode && document.visibilityState==="visible" && !wakeLock) holdScreen(true);
});

const displayURL = () => location.origin + location.pathname + "#display";

/* Which context the app is running in. Printing and notifications behave
   differently in each, so this is worth being able to read off the screen. */
function launchMode(){
  const ios = window.navigator.standalone === true;
  const other = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
  return (ios || other) ? "standalone (home screen)" : "browser tab";
}

function applyRoute(){
  displayMode = location.hash === "#display";
  document.body.classList.toggle("display-on", displayMode);
  holdScreen(displayMode);
  render();
}
window.addEventListener("hashchange", applyRoute);

/* ---------------- Events ---------------- */
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches("td.cell select")) setSlot(+t.dataset.i, t.dataset.p, t.value);
  else if(t.id==="gamePick"){ S.cur=t.value; saveCur(); render(); }
  else if(t.id==="gDate"){ game().date=t.value; reorderGames(); commit();
    writeGameField(game().id,"date",game().date); refreshPicker(); }
  else if(t.id==="gInn"){ game().innings=+t.value; commit();
    writeGameField(game().id,"innings",game().innings); }
  else if(t.id==="gPlayed"){
    const g=game();
    g.played = t.value ? +t.value : null;
    commit(); writeGameField(g.id,"played", g.played===null ? DELETE : g.played);
  }
});
/* While typing, only the in-memory value changes. Rewriting the picker or the
   print sheet on every keystroke was tearing down DOM around the caret, which
   iOS answers by closing the keyboard. Persist on commit instead. */
document.addEventListener("input",e=>{
  if(e.target.id==="gOpp"){ const g=game(); if(g) g.opp=e.target.value; }
});
function commitOpp(){
  const g=game(); if(!g) return;
  saveLocal(); renderPrint(); refreshPicker();
  writeGameField(g.id,"opp",g.opp||"");
}
document.addEventListener("change",e=>{ if(e.target.id==="gOpp") commitOpp(); });
document.addEventListener("blur",e=>{ if(e.target && e.target.id==="gOpp") commitOpp(); }, true);
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="syncBtn"){
    tab="game"; render();
    const c=document.getElementById("syncCard");
    if(c){ c.scrollIntoView({behavior:"smooth",block:"center"}); c.classList.add("pulse");
           setTimeout(()=>c.classList.remove("pulse"),1400); }
  }
  else if(b.dataset.tab){
    tab=b.dataset.tab;
    if(tab==="notes") markNotesRead();
    render();
  }
  else if(b.id==="newGame") newGame();
  else if(b.dataset.toggle) toggleOut(b.dataset.toggle);
  else if(b.dataset.up) moveBat(b.dataset.up,-1);
  else if(b.dataset.down) moveBat(b.dataset.down,1);
  else if(b.id==="addPlayer"){
    const el=document.getElementById("newName"), nm=(el.value||"").trim();
    if(!nm) return;
    const id=pid(nm)+(S.roster.some(p=>p.id===pid(nm))?"_"+Date.now().toString(36).slice(-3):"");
    S.roster.push({id,name:nm}); el.value="";
    commit(); writeRoster();
  }
  else if(b.dataset.remove){
    const id=b.dataset.remove;
    if(!confirm("Remove "+nameOf(id)+" from the roster?")) return;
    S.roster=S.roster.filter(p=>p.id!==id);
    S.games.forEach(g=>{
      g.order=(g.order||[]).filter(x=>x!==id);
      g.out=(g.out||[]).filter(x=>x!==id);
      Object.keys(g.slots).forEach(k=>{ if(g.slots[k]===id) delete g.slots[k]; });
    });
    commit(); writeRoster(); S.games.forEach(writeGame);
  }
  else if(b.id==="incCur"){
    document.body.dataset.incCur = document.body.dataset.incCur==="1"?"0":"1"; render();
  }
  else if(b.id==="addCoach"){
    const el=document.getElementById("newCoach");
    addCoach(el && el.value);
  }
  else if(b.dataset.me !== undefined){ setMe(b.dataset.me || null); }
  else if(b.id==="notePost"){
    const el=document.getElementById("noteText");
    const v=(el.value||"").trim();
    if(!v) return;
    el.value="";
    addNote(v);
  }
  else if(b.dataset.delnote){
    if(confirm("Delete this note?")) dropNote(b.dataset.delnote);
  }
  else if(b.dataset.ha !== undefined){
    const g=game(); g.ha=b.dataset.ha||"";
    commit(); writeGameField(g.id,"ha",g.ha); refreshPicker();
  }
  else if(b.id==="dExit"){ location.hash=""; }
  else if(b.id==="dPrev") setInning(liveInning(game())-1);
  else if(b.id==="dNext") setInning(liveInning(game())+1);
  else if(b.id==="openDisplay"){ location.hash="#display"; }
  else if(b.id==="shareDisplay"){
    const url = displayURL();
    if(navigator.share){
      navigator.share({title:"Warriors game-day display", url}).catch(()=>{});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(()=>alert("Link copied.")).
        catch(()=>prompt("Copy this link:", url));
    } else prompt("Copy this link:", url);
  }
  else if(b.id==="printNormal") doPrint(false);
  else if(b.id==="printRot") doPrint(true);
  else if(b.id==="impPreview" || b.id==="impGo"){
    const txt=(document.getElementById("impText").value||"").trim();
    const innCount=+document.getElementById("impInn").value;
    const when=document.getElementById("impDate").value;
    const out=document.getElementById("impOut");
    if(!txt){ out.innerHTML=`<div class="check err"><span class="tag">EMPTY</span><span>Nothing pasted yet.</span></div>`; return; }
    const r=parseLineup(txt,innCount);
    const lines=[];
    lines.push(`<div class="check ${r.filled===r.expected?"ok":"warn"}"><span class="tag">${r.filled}/${r.expected}</span>
      <span>Read ${r.positions} positions across ${innCount} innings.</span></div>`);
    if(r.fuzzy.length) lines.push(`<div class="check warn"><span class="tag">READ AS</span>
      <span>${r.fuzzy.map(f=>esc(f.from)+" \u2192 "+esc(f.to)).join(", ")}. Check that's right.</span></div>`);
    if(r.unknown.length) lines.push(`<div class="check err"><span class="tag">NO MATCH</span>
      <span>Not on the roster: ${esc(r.unknown.join(", "))}. Add them under Who's In, then import again.</span></div>`);
    lines.push(r.order.length
      ? `<div class="check ${r.order.length>=9?"ok":"warn"}"><span class="tag">BATTING ${r.order.length}</span>
         <span>${esc(r.order.map(nameOf).join(", "))}</span></div>`
      : `<div class="check warn"><span class="tag">NO ORDER</span>
         <span>No batting order found. Include the numbered name column, or set it on the Batting tab after importing.</span></div>`);
    if(r.benchOnly.length) lines.push(`<div class="check info"><span class="tag">BENCH ONLY</span>
      <span>Sat every inning but present: ${esc(r.benchOnly.map(nameOf).join(", "))}.</span></div>`);
    if(r.out.length) lines.push(`<div class="check info"><span class="tag">OUT</span>
      <span>Never took the field, so marked missing: ${esc(r.out.map(nameOf).join(", "))}.</span></div>`);
    out.innerHTML=lines.join("");
    if(b.id==="impGo"){
      if(!when){ out.innerHTML+=`<div class="check err"><span class="tag">DATE</span><span>Set the date first — trends are ordered by it.</span></div>`; return; }
      if(r.unknown.length) return;
      const id="g_"+when.replace(/-/g,"");
      if(S.games.some(g=>g.id===id) && !confirm("A game on "+fmtDate(when)+" already exists. Replace it?")) return;
      S.games=S.games.filter(g=>g.id!==id);
      const g={id,date:when,opp:"",innings:innCount,out:r.out,
        order:r.order.length?r.order:S.roster.filter(p=>!r.out.includes(p.id)).map(p=>p.id),
        slots:r.slots,created:Date.parse(when)};
      S.games.push(g); reorderGames(); S.cur=id; tab="lineup";
      saveCur(); commit(); writeGame(g); refreshPicker();
    }
  }
  else if(b.id==="copyDiag"){
    const txt=["Warriors lineup diagnostics","build "+BUILD+" · schema "+SCHEMA+" · team "+TEAM_ID,
      "connection "+SYNC.mode+" · pending "+SYNC.pending,
      "last save "+(SYNC.lastAt?new Date(SYNC.lastAt).toISOString():"never"),
      "last error "+(SYNC.lastErr||"none"),"",...SYNC.log].join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).
      then(()=>alert("Copied.")).catch(()=>prompt("Copy this:",txt));
  }
  else if(b.id==="pushAll"){
    if(!ready){ alert("Not connected to the database yet."); return; }
    writeRoster(); S.games.forEach(writeGame); note("manual re-send");
  }
  else if(b.id==="dupGame") newGame(game());
  else if(b.id==="delGame"){
    const g=game();
    if(!confirm("Delete the "+fmtDate(g.date)+" game?")) return;
    S.games=S.games.filter(x=>x.id!==g.id);
    S.cur=(S.games[S.games.length-1]||{}).id||null;
    commit(); removeGame(g.id);
    refreshPicker();
  }
});

function newGame(from){
  const id="g_"+Date.now().toString(36);
  const today=new Date().toISOString().slice(0,10);
  const g={ id, date:today, opp:"", innings:from?from.innings:6,
    out:from?[...(from.out||[])]:[],
    order:from?[...(from.order||[])]:S.roster.map(p=>p.id),
    slots:{}, done:false, created:Date.now() };
  S.games.push(g); S.cur=id; tab="lineup";
  saveCur(); commit(); writeGame(g); refreshPicker();
}
function reorderGames(){ S.games.sort((a,b)=>(a.date||"").localeCompare(b.date||"")); }
function saveCur(){ try{ localStorage.setItem(LS+"_cur",S.cur||""); }catch(e){} }
function copyGame(g){ const o = {id:g.id,date:g.date||"",opp:g.opp||"",innings:g.innings||6,
  out:[...(g.out||[])],order:[...(g.order||[])],slots:{...(g.slots||{})},created:g.created||Date.now()};
  if(g.ha) o.ha=g.ha;
  if(g.played) o.played=g.played;
  if(g.actual) o.actual={...g.actual};
  return o; }

function refreshPicker(){
  const sel=document.getElementById("gamePick");
  const sorted=[...S.games].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  sel.innerHTML=sorted.map(g=>
    `<option value="${g.id}" ${g.id===S.cur?"selected":""}>${fmtDate(g.date)}${g.opp?" "+esc(vsLabel(g)):""}</option>`
  ).join("") || `<option>No games</option>`;
}

/* ---------------- Firestore ----------------
   Shape:  teams/{TEAM_ID}                -> { schema, roster:[...] }
           teams/{TEAM_ID}/games/{gameId} -> { date, opp, innings, out, order, slots:{...} }
   `slots` is a map, not an array, so a single cell can be written by field
   path and merged with someone else's simultaneous edit to a different cell. */

const DELETE = Symbol("delete-field");
let FS=null, DB=null, teamRef=null, gamesRef=null;
let ready=false;              // true only after the server has spoken
let sawTeam=false, sawGames=false;
let teamExists=null, teamHasRoster=false, serverGames=0;
let notesRef=null;

async function connect(){
  if(!FIREBASE_CONFIG){ setSync("local","this device only"); return; }
  setSync("connecting","opening database");
  try{
    const [{initializeApp}, fs] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js")
    ]);
    FS=fs; DB=fs.getFirestore(initializeApp(FIREBASE_CONFIG));
    teamRef  = fs.doc(DB,"teams",TEAM_ID);
    gamesRef = fs.collection(DB,"teams",TEAM_ID,"games");
    notesRef = fs.collection(DB,"teams",TEAM_ID,"notes");

    fs.onSnapshot(teamRef, snap=>{
      sawTeam=true; teamExists=snap.exists();
      const d=snap.data();
      if(d && Array.isArray(d.coaches)) S.coaches = d.coaches;
      if(d && Array.isArray(d.roster) && d.roster.length){ S.roster=d.roster; teamHasRoster=true; }
      else if(d && typeof d.state==="string"){
        // migration from the original single-document format
        try{
          const old=JSON.parse(d.state);
          if(old.roster && old.roster.length) S.roster=old.roster;
          if(old.games && old.games.length) S.games=old.games;
          note("migrated "+(old.games||[]).length+" game(s) from the old single-document format");
        }catch(e){ note("old-format data unreadable: "+codeOf(e)); }
      }
      arrive();
    }, err=>setSync("error","team read failed", err));

    fs.onSnapshot(gamesRef, snap=>{
      sawGames=true; serverGames=snap.size;
      if(!snap.empty){
        S.games = snap.docs.map(d=>Object.assign({id:d.id},d.data()));
        reorderGames();
        if(!S.games.some(g=>g.id===S.cur)) S.cur=(S.games[S.games.length-1]||{}).id||null;
      }
      arrive();
    }, err=>{
      setSync("error","games read failed", err);
      if(codeOf(err)==="permission-denied")
        note("rules must cover teams/"+TEAM_ID+"/games/** , not just the team document");
    });

    // Notes are their own stream: a notes failure must not stall the lineup,
    // and lineup readiness must not gate the thread.
    fs.onSnapshot(notesRef, snap=>{
      S.notes = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      saveLocal();
      if(tab==="notes" || unreadNotes()) render();
    }, err=>setSync("error","notes read failed", err));

  }catch(e){ setSync("error","could not load Firebase", e); }
}

/* Seeding is non-destructive: the built-in roster and the 8/22 card are only
   written when the team document does not exist yet. An app update never
   overwrites what is already on the server. */
function arrive(){
  if(!(sawTeam && sawGames)) return;
  const first = !ready;
  ready = true;
  if(first){
    // Seed or backfill: the guard is "the server is missing this", not merely
    // "the team document is absent" — an older schema left the doc in place
    // with no games under it, and cell writes then had nothing to patch.
    if(!teamHasRoster){ note("no roster on the server — uploading it"); writeRoster(); }
    if(serverGames===0 && S.games.length){
      note("no games on the server — uploading "+S.games.length);
      S.games.forEach(writeGame);
    }
  }
  SYNC.lastAt=Date.now();
  setSync("live");
  saveLocal(); refreshPicker(); render();
}

function track(promise, what){
  SYNC.pending++; paintSync();
  return promise.then(()=>{
    SYNC.pending--; SYNC.lastAt=Date.now();
    if(SYNC.mode!=="error") setSync("live");
    else paintSync();
  }).catch(e=>{
    SYNC.pending--;
    setSync("error", what+" write failed", e);
  });
}

function writeCoaches(){
  if(!DB || !ready) return;
  track(FS.setDoc(teamRef,{coaches:S.coaches||[],at:Date.now()},{merge:true}),"names");
}
function writeRoster(){
  if(!DB || !ready) return;
  track(FS.setDoc(teamRef,{schema:SCHEMA,roster:S.roster,at:Date.now()},{merge:true}),"roster");
}
function writeGame(g){
  if(!DB || !ready) return;
  track(FS.setDoc(FS.doc(gamesRef,g.id), copyGame(g)),"game");
}
function writeGameField(gid, path, val){
  if(!DB || !ready) return;
  const v = val===DELETE ? FS.deleteField() : val;
  const ref = FS.doc(gamesRef,gid);
  track(FS.updateDoc(ref,{[path]:v}).catch(e=>{
    if(codeOf(e)!=="not-found") throw e;
    const g = S.games.find(x=>x.id===gid);
    if(!g) throw e;
    note("game "+gid+" was missing on the server — uploading the whole card");
    return FS.setDoc(ref, copyGame(g));   // patch had nothing to patch; create it
  }),"cell");
}
function writeNote(n){
  if(!DB || !ready) return;
  track(FS.setDoc(FS.doc(notesRef,n.id), {who:n.who,text:n.text,at:n.at,game:n.game||""}),"note");
}
function removeNote(id){
  if(!DB || !ready) return;
  track(FS.deleteDoc(FS.doc(notesRef,id)),"note delete");
}
function removeGame(gid){
  if(!DB || !ready) return;
  track(FS.deleteDoc(FS.doc(gamesRef,gid)),"delete");
}

/* ---------------- Boot ---------------- */
(function init(){
  loadMe();
  if(!loadLocal()){
    S.roster=SEED_ROSTER.map(p=>({...p}));
    S.games=[seedGame()];
  }
  try{ S.cur=localStorage.getItem(LS+"_cur")||null; }catch(e){}
  if(!S.games.some(g=>g.id===S.cur)) S.cur=(S.games[S.games.length-1]||{}).id||null;
  reorderGames();
  refreshPicker();
  applyRoute();
  connect();
})();
</script>
</body>
</html>
